<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6857">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klassali">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Klassali Terrain</title>
<style>
/* Outil de terrain à une main : gros chiffres (le numéro de photo est le héros), une couleur par séance. */
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --surface2:#E2E7E0; --ink:#14201A; --muted:#51625A; --line:#C5CEC6;
  --rt:#0D6857; --rt-ink:#FFFFFF; --grp:#3949A3; --grp-ink:#FFFFFF; --main:#8A4B0F; --main-ink:#FFFFFF;
  --warn:#9A4300; --warn-bg:#FBE8D0; --ok:#1B7339; --ok-bg:#DCF0E1; --danger:#B3261E;
  --accent:var(--rt); --accent-ink:var(--rt-ink);
  --display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1613; --surface:#18221E; --surface2:#222E29; --ink:#E9F0EB; --muted:#9BABA2; --line:#32423B;
  --rt:#43C4AA; --rt-ink:#052019; --grp:#A3B0FF; --grp-ink:#0E1440; --main:#F0B36B; --main-ink:#2A1600;
  --warn:#F2A55C; --warn-bg:#3A2610; --ok:#6FD38D; --ok-bg:#15301E; --danger:#FF8F86; color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body[data-mode="grp"]{--accent:var(--grp);--accent-ink:var(--grp-ink)}
body[data-mode="main"]{--accent:var(--main);--accent-ink:var(--main-ink)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--accent)}
.top .back{min-width:48px;min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:20px;line-height:1}
.top h1{margin:0;font:800 20px/1.1 var(--display);flex:1;min-width:0}
.top h1 small{display:block;font:400 13px var(--body);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .gear{min-width:48px;min-height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:20px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:16px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:92px;border:0;border-radius:16px;padding:16px;color:var(--main-ink);background:var(--main)}
.mode.r{background:var(--rt);color:var(--rt-ink)}
.mode.g{background:var(--grp);color:var(--grp-ink)}
.mode b{font:800 20px/1.1 var(--display);display:block}
.mode span.d{font-size:14px;opacity:.92;display:block;margin-top:4px}
.mode .big{font:800 40px/1 var(--display);min-width:56px;text-align:center}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:12px 0;text-align:left;min-height:48px}
h2{font:800 16px var(--display);margin:0 0 8px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:14px}
.tabs button{min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0 4px;color:var(--muted);font-size:14px}
.sum b{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:96px}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:72px}
.num{font:800 34px/1 var(--display);min-width:68px;font-variant-numeric:tabular-nums}
.num small{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:4px;letter-spacing:0}
.main{flex:1;min-width:0}
.main b{display:block;font-size:17px;overflow-wrap:anywhere}
.main span{font-size:13px;color:var(--muted);display:block;margin-top:2px;overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.pill.eleve{background:var(--ok-bg);color:var(--ok)}.pill.fratrie{background:var(--warn-bg);color:var(--warn)}.pill.classe{background:var(--surface2);color:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:60px;padding:0 22px;border-radius:30px;border:0;background:var(--accent);color:var(--accent-ink);font:800 18px var(--display);box-shadow:0 4px 14px rgba(0,0,0,.28)}
.fab2{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:60px;padding:0 18px;border-radius:30px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h3{margin:0;font:800 20px var(--display)}
.x{min-width:48px;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px}
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input[type=text],input[type=search],input[type=date],input[inputmode=numeric]{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:400 18px var(--body)}
input.bignum{font:800 40px var(--display);min-height:68px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.warn{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.okbox{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select.csel{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:700 17px var(--body);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat;margin-bottom:8px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow-y:auto}
.pick button{display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pick .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.pick .st{font-size:12px;font-weight:700;white-space:nowrap}
.st.abs{color:var(--warn)}.st.done{color:var(--ok)}.st.n{color:var(--muted)}
.chk{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;flex:none;display:grid;place-items:center;font-size:16px;line-height:1}
button[aria-pressed="true"] .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.newbox{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700}
.cb input{width:24px;height:24px;accent-color:var(--accent)}
.btn{min-height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:800 18px var(--display);width:100%}
.btn[disabled]{opacity:.4}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-family:var(--body);font-weight:700;font-size:16px}
.btn.del{background:none;color:var(--danger);border:1.5px solid var(--line);font-family:var(--body);font-size:16px}
pre.csv{margin:0;padding:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;font:12px/1.5 var(--mono);overflow-x:auto;white-space:pre;max-height:30vh}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;max-width:90%;text-align:center}
.todo{border-left:5px solid var(--warn)}
.lotrow{display:flex;align-items:center;gap:10px}
.lotrow button.pickl{flex:1;text-align:left;min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.lotrow button.pickl small{font-weight:400;color:var(--muted)}
.lotrow button.pickl[aria-pressed="true"]{border-color:var(--rt);box-shadow:inset 0 0 0 2px var(--rt)}
.filehint{font-size:13px;color:var(--muted);margin:6px 0 0}
input[type=file]{width:100%;min-height:52px;font-size:14px}
.proj{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:8px 12px;width:100%;text-align:left}
.proj[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.proj .nm{flex:1;min-width:0;font-weight:700}
.proj small{color:var(--muted);font-weight:400;display:block}
.danger{color:var(--danger)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin-top:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
(function(){
'use strict';
var APP_VERSION='1.1.0';
var LS='klassali-terrain-v1';

/* =========================== état =========================== */
function emptyState(){return{v:1,projects:{},activeProjectId:null,activeSession:null,prefix:'',photographer:'',email:'contact@laurentthesee.com',tab:'series'};}
var S;try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
if(!S||!S.projects)S=emptyState();
var D=null,toastT=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Mémoire du téléphone pleine : exportez et effacez un projet.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayIso(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function P(){return S.activeProjectId?S.projects[S.activeProjectId]:null}
function sess(){var p=P();if(!p||!S.activeSession)return null;if(!p.sessions[S.activeSession])p.sessions[S.activeSession]={series:[]};return p.sessions[S.activeSession]}
function sessKind(id){id=id||S.activeSession||'';return id==='principale'?'principale':id==='groupes'?'groupes':id.indexOf('rattrapage:')===0?'rattrapage':''}
function sessLot(id){id=id||S.activeSession||'';return id.indexOf('rattrapage:')===0?id.slice(11):null}
function sessLabel(id){var k=sessKind(id);return k==='principale'?'Séance principale':k==='groupes'?'Groupes (2ᵉ photographe)':'Rattrapage '+sessLot(id)}
function cls(id){var p=P();var c=p&&p.classes.filter(function(x){return String(x.id)===String(id)})[0];return c?c.name:'?'}
function stu(id){var p=P();return p&&p.students.filter(function(x){return String(x.id)===String(id)})[0]}
function realClassId(id){var p=P();var c=p&&p.classes.filter(function(x){return String(x.id)===String(id)})[0];return c?c.id:id}
function realStudentId(id){var s=stu(id);return s?s.id:id}
function sname(s){if(!s)return'?';if(s.generic)return'Élève rattrapage '+(s.genericNo||'');return((s.prenom||'')+' '+(s.nom||'')).trim()||'(sans nom)'}
function pad(n){return S.prefix?S.prefix+String(n).padStart(4,'0'):String(n)}
function sortedSeries(sx){return (sx||sess()||{series:[]}).series.slice().sort(function(a,b){return a.num-b.num})}
function assignedNum(sid,exceptId){var r=null;(sess()||{series:[]}).series.forEach(function(e){if(e.id===exceptId)return;if((e.type==='eleve'&&String(e.studentId)===String(sid))||(e.type==='fratrie'&&(e.members||[]).some(function(m){return String(m)===String(sid)})))r=e.num});return r}
function isAbsent(s){return s.statut==='Absent'||(!s.photos&&s.statut!=='Refus'&&s.statut!=='Photo prise')} // sans photo = à rattraper
function absLabel(s){return s.statut==='Absent'?'absent':'sans photo'}
function remaining(){var p=P();if(!p)return[];var k=sessKind();return p.students.filter(function(s){if(assignedNum(s.id)!==null)return false;if(k==='rattrapage')return isAbsent(s)&&!s.created;if(k==='principale')return s.statut!=='Refus'&&!s.created;return false})}
function toast(m){document.querySelectorAll('.toast').forEach(function(x){x.remove()});var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},2600)}

/* =========================== QR (#k=) et fichier projet =========================== */
function b64urlDecodeUtf8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function ensureProject(id){if(!S.projects[id])S.projects[id]={id:id,token:'',school:'',year:'',role:'groups',classes:[],students:[],fratries:[],sessions:{},lastCls:null,fileLoadedAt:null,qrAt:null};return S.projects[id]}
function normName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
function mergeClasses(p,list){list.forEach(function(c){var name=(c.name||'').trim();if(!name)return;var ex=p.classes.filter(function(x){return normName(x.name)===normName(name)})[0];
  if(ex){ex.name=name;if(c.id!=null&&c.id!==''&&String(c.id)!==name){var old=ex.id;ex.id=c.id;if(String(old)!==String(c.id)){(p.students||[]).forEach(function(st){if(String(st.classId)===String(old))st.classId=c.id});Object.keys(p.sessions||{}).forEach(function(k){p.sessions[k].series.forEach(function(e){if(String(e.classId)===String(old))e.classId=c.id})})}}ex.isTeachers=!!c.isTeachers}
  else p.classes.push({id:(c.id!=null&&c.id!=='')?c.id:name,name:name,isTeachers:!!c.isTeachers})})}
function applyQr(q){
  if(!q||!q.id)return false;
  var p=ensureProject(q.id);
  if(q.t)p.token=q.t;p.school=q.s||p.school;p.year=q.y||p.year;p.name=p.school;
  if(q.r==='full'||p.role==='full')p.role='full';else p.role='groups';
  mergeClasses(p,(q.c||[]).map(function(x){return{id:x[0],name:x[1]}}));
  p.qrAt=new Date().toISOString();
  S.activeProjectId=q.id;S.activeSession=null;save();return true}
function parseQr(raw){
  if(/^2\|/.test(raw)||/^2%7C/i.test(raw)){var parts=decodeURIComponent(raw).split('|');if(parts.length<5)return null;return{v:2,id:parts[1],s:parts[2],y:parts[3],r:parts[4]==='g'?'groups':'full',c:parts.slice(5).filter(Boolean).map(function(n){return[n,n]})}}
  try{return JSON.parse(b64urlDecodeUtf8(raw))}catch(e){return null}}
function readHash(){
  var m=/[#&]k=([^&]+)/.exec(location.hash||'');
  if(!m)return;
  var q=parseQr(m[1]);
  if(q&&applyQr(q)){toast('Projet « '+(q.s||q.id)+' » chargé depuis le QR code.')}else toast('QR code illisible.');
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
}
function importProjectFile(text){
  var j;try{j=JSON.parse(text)}catch(e){return toast('Fichier illisible (pas un JSON).')}
  if(!j||j.format!=='klassali-terrain'||!j.project||!j.project.id)return toast("Ce n'est pas un fichier projet Klassali.");
  var p=ensureProject(j.project.id);
  p.token=j.project.token||p.token;p.school=j.project.school||p.school;p.year=String(j.project.year||p.year);p.role='full';
  mergeClasses(p,j.classes||[]);
  var created=p.students.filter(function(s){return s.created});
  p.students=(j.students||[]).map(function(s){return{id:s.id,nom:s.nom||'',prenom:s.prenom||'',classId:s.classId,statut:s.statut||'',photos:s.photos||0}}).concat(created);
  p.fratries=(j.fratries||[]).map(function(f){return{id:f.id,nom:f.nom||'',membres:f.membres||[],photos:f.photos||0}});
  p.fileLoadedAt=new Date().toISOString();
  S.activeProjectId=p.id;save();
  toast('Projet « '+p.school+' » : '+p.students.length+' élèves, '+p.classes.length+' classes chargés.');
  S.mode='home';render();
}

/* =========================== vues =========================== */
function setMode(){var k=sessKind();document.body.dataset.mode=k==='groupes'?'grp':k==='principale'?'main':'rt';if(S.mode==='home'||S.mode==='set'){var p=P();document.body.dataset.mode=p&&p.role==='groups'?'grp':'rt'}}
function topbar(title,sub,back,gear){return '<div class="top">'+(back?'<button class="back" data-act="home" aria-label="Retour">←</button>':'')+'<h1>'+esc(title)+'<small>'+esc(sub)+'</small></h1>'+(gear?'<button class="gear" data-act="go" data-mode="set" aria-label="Paramètres">⚙</button>':'')+'</div>'}
function viewHome(){
  var p=P();
  if(!p){return topbar('Klassali Terrain','Aucun projet chargé',false,true)+'<div class="stack"><div class="card"><h2>Pour commencer</h2><p style="margin:0 0 10px;font-size:15px">Scannez le QR code affiché par Klassali (menu <b>Terrain</b>) avec l’appareil photo du téléphone, ou chargez le fichier projet.</p><label class="f" for="pf0">Fichier projet (Klassali_Projet_….json)</label><input type="file" id="pf0" accept=".json,application/json"><label class="f" for="code" style="margin-top:12px">Ou code projet / lien reçu par WhatsApp</label><input type="text" id="code" placeholder="2|ab12cd34|École…" autocomplete="off"><button class="btn sec" style="margin-top:8px" data-act="usecode">Créer le projet</button></div><div class="card"><h2>Comment ça marche</h2><ol style="margin:0;padding-left:18px;font-size:14px;line-height:1.5"><li>Après chaque enfant photographié, touchez « + Numéro » et tapez le numéro de la première photo.</li><li>Choisissez l’élève (ou la fratrie, ou la classe).</li><li>Au retour, « Exporter » : le fichier est lu par Klassali pour associer les photos automatiquement.</li></ol></div></div>'}
  var h=topbar('Klassali Terrain',p.school+' · '+p.year,false,true)+'<div class="stack">';

function allowedTypes(){return sessKind()==='groupes'?['classe']:['eleve','fratrie','classe']}

function validRt(){
  if(!/^\d+$/.test(D.num||''))return false;

function filtered(){

    var ra=assignedNum(a.id,D.id)===null&&(sessKind()!=='rattrapage'||isAbsent(a))?0:1,rb=assignedNum(b.id,D.id)===null&&(sessKind()!=='rattrapage'||isAbsent(b))?0:1;

  var series=list.map(function(e,i){var o={order:i+1,num:e.num,numEnd:i<list.length-1?list[i+1].num-1:null,type:e.type,at:e.at||null};
    if(e.type==='eleve'){var s=stu(e.studentId);o.studentId=e.studentId;o.classId=s?s.classId:null;o.className=s?cls(s.classId):'';o.label=sname(s)}
    else if(e.type==='fratrie'){o.label=e.label||'';o.members=e.members||[]}
    else{o.classId=e.classId;o.className=cls(e.classId);o.g=1;o.label=cls(e.classId)}
    return o});
  var newStudents=p.students.filter(function(s){return s.created&&usedStudentIds[s.id]}).map(function(s){return{id:s.id,nom:s.nom,prenom:s.prenom,classId:s.classId,className:cls(s.classId),generic:!!s.generic}});
  var newClasses=p.classes.filter(function(c){return c.created&&usedClassIds[c.id]}).map(function(c){return{id:c.id,name:c.name}});
  var json={format:'klassali-terrain-series',version:1,
    project:{id:p.id,token:p.token,school:p.school,year:p.year},
    session:{kind:k,lot:sessLot(),role:p.role,photographer:S.photographer||'',exportedAt:new Date().toISOString(),app:APP_VERSION},
    classes:p.classes.map(function(c){return{id:c.id,name:c.name,created:!!c.created}}),
    newStudents:newStudents,newClasses:newClasses,series:series};
  var csv=['numero_debut;numero_fin;type;classe;eleve;fratrie;enfants_lies;cree_sur_place'].concat(series.map(function(o){
    var c=o.classId?cls(o.classId):'';var st=o.studentId?stu(o.studentId):null;
    return[o.num,o.numEnd===null?'':o.numEnd,o.type,c,o.type==='eleve'?o.label:'',o.type==='fratrie'?o.label:'',o.type==='fratrie'?(o.members||[]).map(function(m){return sname(stu(m))}).join('|'):'',(st&&st.created)||(o.type==='classe'&&p.classes.filter(function(x){return String(x.id)===String(o.classId)&&x.created}).length)?1:0].join(';')})).join('\n');
  var base=(k==='principale'?'Principale_'+fileSafe(p.school)+'_'+fileSafe(p.year):k==='rattrapage'?'Rattrapage_'+fileSafe(p.school)+'_'+sessLot():'Groupes_'+fileSafe(p.school)+'_'+todayIso()+(S.photographer?'_'+fileSafe(S.photographer):''));
  return{json:json,csv:csv,base:base}}
function mailSubject(){var p=P(),k=sessKind();return p.school+' '+p.year+' — '+(k==='groupes'?'groupes':k==='rattrapage'?'rattrapage '+sessLot():'séance principale')+(S.photographer?' ('+S.photographer+')':'')}
function openExport(){
  var ex=buildExport();window.__lastExport=ex;
  var canShare=!!(navigator.share&&navigator.canShare&&window.File);
  var h='<div class="overlay" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3>Exporter '+esc(sessLabel())+'</h3><button class="x" data-act="close" aria-label="Fermer">✕</button></div>';
  h+='<div class="hint" style="margin:0">'+ex.json.series.length+' série(s) · fichier <b>'+esc(ex.base)+'.json</b> (lu par Klassali) + <b>'+esc(ex.base)+'.csv</b> (lisible dans Excel).</div>';
  if(!ex.json.series.length)h+='<div class="warn">Aucune série à exporter.</div>';
  h+='<div class="hint" style="margin:0">Objet du message : <b>'+esc(mailSubject())+'</b> · à envoyer à <b>'+esc(S.email||'')+'</b></div>';
  h+='<button class="btn" data-act="share" '+(ex.json.series.length?'':'disabled')+'>'+(canShare?'✉ Envoyer par e-mail (ou WhatsApp, Drive…)':'Télécharger le fichier JSON')+'</button>';
  if(canShare)h+='<div class="hint" style="margin:0">Choisissez Gmail dans la liste : le fichier est joint et l’objet rempli ; il reste à indiquer le destinataire (Gmail le propose dès le 2ᵉ envoi).</div><button class="btn sec" data-act="download">Télécharger (JSON + CSV)</button>';
  h+='<a class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="mailto:'+esc(encodeURIComponent(S.email||''))+'?subject='+esc(encodeURIComponent(mailSubject()))+'&body='+esc(encodeURIComponent('Fichier Klassali Terrain : '+ex.base+'.json (à joindre depuis Téléchargements si absent).'))+'">Ouvrir un e-mail vide (sans pièce jointe)</a>';
  h+='<button class="btn sec" data-act="copy">Copier le JSON</button><pre class="csv">'+esc(ex.csv)+'</pre></div></div>';
  document.getElementById('layer').innerHTML=h}
function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000)}
function doShare(){
  var ex=window.__lastExport;if(!ex)return;
  var jtxt=JSON.stringify(ex.json,null,2);
  if(navigator.share&&navigator.canShare&&window.File){
    var files=[new File([jtxt],ex.base+'.json',{type:'application/json'}),new File([ex.csv],ex.base+'.csv',{type:'text/csv'})];
    if(navigator.canShare({files:files})){navigator.share({files:files,title:mailSubject(),text:'À : '+(S.email||'')+'\n'+mailSubject()+'\n'+ex.json.series.length+' série(s) — fichier '+ex.base+'.json (Klassali Terrain)'}).then(function(){toast('Partagé.')}).catch(function(e){if(e&&e.name!=='AbortError'){download(ex.base+'.json',jtxt,'application/json');download(ex.base+'.csv',ex.csv,'text/csv')}});return}
  }
  download(ex.base+'.json',jtxt,'application/json');download(ex.base+'.csv',ex.csv,'text/csv')}

/* =========================== événements =========================== */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');
  if(a==='close'){if(ev.target.closest('.sheet')&&!ev.target.closest('.x'))return;closeSheet();return}
  if(a==='home'){S.mode='home';save();render();return}
  if(a==='go'){S.mode=t.getAttribute('data-mode');save();render();return}
  if(a==='open'){S.activeSession=t.getAttribute('data-s');S.mode='session';S.tab='series';sess();save();render();return}
  if(a==='newlot'){var d=(document.getElementById('newlot')||{}).value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return toast('Choisissez une date.');var p=P();var key='rattrapage:'+d;if(p.sessions[key])return toast('Ce lot existe déjà.');p.sessions[key]={series:[]};S.activeSession=key;S.mode='session';S.tab='series';save();render();toast('Lot '+d+' créé.');return}
  if(a==='tab'){S.tab=t.getAttribute('data-tab');save();render();return}
  if(a==='add'){D=blank();openSheet();return}
  if(a==='addfor'){D=blank();var s=stu(id);if(!s)return;D.type='eleve';D.cls=s.classId;D.studentId=s.id;openSheet();return}
  if(a==='edit'){var e=sess().series.filter(function(x){return x.id===id})[0];if(!e)return;D=blank();D.id=e.id;D.num=String(e.num);D.type=e.type;
    if(e.type==='eleve'){D.studentId=e.studentId;var ss=stu(e.studentId);D.cls=ss?ss.classId:'all'}else if(e.type==='fratrie'){D.label=e.label||'';D.members=(e.members||[]).slice();D.cls='all'}else D.cls=e.classId;
    openSheet();return}
  if(a==='pt'){D.type=t.getAttribute('data-t');if(D.type==='classe'&&(D.cls==='all'||D.cls==null)){var pp=P();D.cls=pp.lastCls||(pp.classes[0]&&pp.classes[0].id)}if(D.type==='fratrie')D.cls='all';D.q='';D.newOn=false;D.newClassOn=false;rebody();document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b===t)});return}
  if(a==='ps'){D.studentId=String(D.studentId)===String(id)?null:realStudentId(id);D.newOn=false;document.getElementById('pick').innerHTML=pickHtml(false);upd();return}
  if(a==='tm'){var rid=realStudentId(id);var i=D.members.map(String).indexOf(String(rid));if(i>-1)D.members.splice(i,1);else D.members.push(rid);rebody();return}
  if(a==='newtog'){D.newOn=!D.newOn;if(D.newOn)D.studentId=null;rebody();return}
  if(a==='save'){if(validRt())saveRt();return}
  if(a==='del'){var sx=sess();sx.series=sx.series.filter(function(x){return x.id!==D.id});save();closeSheet();render();toast('Série supprimée');return}
  if(a==='export'){openExport();return}
  if(a==='share'){doShare();return}
  if(a==='download'){var ex=window.__lastExport;download(ex.base+'.json',JSON.stringify(ex.json,null,2),'application/json');download(ex.base+'.csv',ex.csv,'text/csv');return}
  if(a==='copy'){var ex2=window.__lastExport;try{navigator.clipboard.writeText(JSON.stringify(ex2.json,null,2)).then(function(){toast('JSON copié')},function(){toast('Copie impossible')})}catch(e){toast('Copie impossible')}return}
  if(a==='usecode'){var raw=(document.getElementById('code')||{}).value||'';var mm=/[#&]k=([^&\s]+)/.exec(raw);var q=parseQr(mm?mm[1]:raw.trim());if(q&&q.id&&applyQr(q)){toast('Projet « '+q.s+' » créé.');S.mode='home';render()}else toast('Code non reconnu. Collez le code ou le lien complet.');return}
  if(a==='selproj'){S.activeProjectId=id;S.activeSession=null;save();render();return}
  if(a==='delproj'){var p2=P();if(!p2)return;if(!S.__confirmDel||S.__confirmDel!==p2.id){S.__confirmDel=p2.id;toast('Touchez encore une fois pour effacer « '+p2.school+' ».');return}delete S.projects[p2.id];S.activeProjectId=Object.keys(S.projects)[0]||null;S.activeSession=null;delete S.__confirmDel;save();render();toast('Projet effacé.');return}
});
window.addEventListener('hashchange',function(){readHash();render()});

readHash();
S.mode=(S.mode==='session'&&sess())?'session':'home';

}
